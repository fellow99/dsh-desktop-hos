# dsh-desktop 自定义 desktop profile 的用户 patch
#
# 目的（产品概念设计第 11 节 A1 方案）：
#   - 复用 web 组合（dsh-base + dsh-web-app）
#   - 微调为桌面：关闭 web-runtime 的 URL 打印（桌面应用无需打印「dsh web: http://...」）
#   - webserver 端口由启动代码经 --port 0 注入（web-app bundle 的 webserver 行
#     `port: !!js ctx.webStartup.port ?? 3080` 已支持，无需在此覆盖）
#
# 语法：覆盖行以 id 定位、整块替换 config（参考 dsh 仓库 cordis.patch.yml 示例）。
# 覆盖基线（对照 deepseek-harness/packages/bundle/web-app/cordis.patch.yml 的
# web-runtime 行，printUrl: true → false；surfaceContext/trustedHosts 保持原值）。

- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  inject: [webStartup]
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

# 鸿蒙桌面版：sharp 已用纯 JS stub 替换（dsh-dist/node_modules/sharp/dist/），
# attachment-local 保持启用（提供 attachments 服务，host-apiproxy 依赖）。
# 图片处理**不是** no-op：stub 解析容器头做准入判定；stub 自身做不了的转换
# （16-bit / ICC / EXIF 方向 / 超限缩放）经 Node↔ArkTS 通用桥交给平台图像框架执行
# （ImageAdapter.ets：解码 → 缩放 → EXIF 旋转 → 重编码），编码器附加的元数据由
# stub 按容器剥离。干净的 8-bit sRGB PNG/JPEG/WebP 在限额内按字节**直通**，不做像素
# 运算；取不到桥时（纯 Node，例如 stub 自测）退回如实拒绝。

# 鸿蒙桌面版：禁用依赖原生模块（.node）的插件 —— dsh-dist 在 Windows 上收集，原生二进制为
# win32-x64（node-pty/koffi），在鸿蒙 aarch64 上无法加载：
#   - subprocess（node-pty）：终端子进程
#   - sandbox（landlock-run + koffi）：进程沙箱
#   - bash-sandbox：依赖 subprocess + sandbox
#   - permission：依赖 shell（subprocess 提供）
# 注：sandbox-policy/pwsh-sandbox/fs-sandbox 之前不在 pending 列表，不额外禁用。
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- id: bash-sandbox
  disabled: true
- id: permission
  disabled: true

# 鸿蒙桌面版：dsh 0.1.5-rc.2 起 host-open-in-app 注入 subprocess 服务（用于探测/启动本机应用），
# 而本平台已禁用 subprocess（node-pty 无 aarch64 产物），该行会持续 pending 导致整棵插件树
# 加载失败（boot: 1 entry did not activate）。鸿蒙无「本机应用打开」语义，故禁用其 host/client 两半。
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true

# 鸿蒙桌面版：禁用客户端「权限」行（@deepseek-ai/dsh-client-ui-permission-presets）。
#
# 宿主 permission 插件（@deepseek-ai/dsh-permission-presets，行 id `permission`，见上）声明
# `static inject = ['shell', 'approval', 'sessions', 'sessionProjections']`，并在
# `ctx.shell.sandboxMode === undefined` 时构造即抛错；本平台 shell/subprocess 已禁用，
# 故该服务无法挂载 → 路由 `/api/permissionPresets/*` 返回 404。
#
# 客户端 ui-permission 在 apply() 时**立即**创建 PermissionCatalogDirectory 并调用
# `permissionPresets/catalog`（catalog.ts:134），失败后把 `transport failure ... HTTP 404`
# 显示在「通用设置 → 权限」。本平台无进程沙箱，权限预设（sandbox + approval）不适用，
# 故禁用该客户端行——与其宿主行一致；`/permission` 命令也随宿主行一并消失。
- id: ui-permission
  disabled: true

# 鸿蒙桌面版：强制 webserver 绑定 0.0.0.0（全网卡）。
# 鸿蒙 NEXT 下 Chromium 渲染进程访问 127.0.0.1 存在 loopback 网络隔离，渲染进程须走局域网 IP。
# 用 profile 覆盖直接设 host（literal），绕过 --host 参数解析。
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  inject: [webStartup]
  config:
    host: '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080

# dsh-market（插件市场）运行配置覆盖（需求 201-dsh-market）
#
# dshmarket 经 dsh.profile.bundles 声明为 bundle，其自身 cordis.patch.yml 会
# insert 行 `{id: dsh-market, name: dshmarket}`（无 config）。此处覆盖该行注入配置：
#   - profile: desktop —— 市场默认 profile 为 'web'（config?.profile ?? argvProfile() ?? 'web'），
#     桌面用 'desktop'，必须显式指定，否则安装/删除会写错目录。
#   - allowRestart: false —— 桌面壳拥有进程生命周期，市场不得 spawn 独立 dsh 进程重启。
- id: dsh-market
  name: dshmarket
  config:
    profile: desktop
    allowRestart: false

# 鸿蒙桌面版（需求 203）：用专用插件 harmony-plugin-workspace-picker 替换内置
# 「选择工作区目录」对话框。
# directory-picker auto 行在 Electron 下会挂载「browse host + 内置 browse client」
# （dsh-disable-native-picker.patch 已强制 resolve→browse）。现需用插件自有 client 面
# 替换内置 browse client，故分三步：
#   1) 禁用 auto 行（连带其在运行期 Loader 树挂载的内置 browse client）；
#   2) 直接 insert browse host 后端（仅 host 面，注册 ctx.directoryPicker，提供
#      directoryPicker/list 与 directoryPicker/createDirectory 两个 Typert RPC）；
#   3) insert 插件 harmony-plugin-workspace-picker：host 面注册四个原生能力 IPC 桥
#      （根路径 / 权限检查 / 权限申请 / 打开应用信息），client 面填充
#      conversation.hero 与 sidebar.workspaces 两个 directory-flow slot。
# browse host 无 dsh.client 字段，不会拉入与插件竞争的 client flow。
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: workspace-picker
      name: harmony-plugin-workspace-picker
